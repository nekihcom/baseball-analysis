name: collect

on:
  schedule:
    - cron: "59 14 * * 5"
  workflow_dispatch:
    inputs:
      teams:
        description: チームID（カンマ区切り）
        required: true
        type: string
      all_years:
        description: 全年度を再取得する
        required: false
        default: false
        type: boolean

# 2 つの実行が同じシートを読み込み・上書きすると、一方の結果が消える
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 実行日時を決める
        id: started
        run: echo "at=$(TZ=Asia/Tokyo date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存ライブラリをインストールする
        run: pip install .

      - name: 認証情報を書き出す
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          key_path="$RUNNER_TEMP/service_account.json"
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$key_path"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$key_path" >> "$GITHUB_ENV"

      - name: 収集する
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          TEAMS: ${{ github.event_name == 'workflow_dispatch' && inputs.teams || vars.TEAM_IDS }}
          ALL_YEARS: ${{ inputs.all_years }}
        run: |
          args=(--teams "$TEAMS")
          if [ "$ALL_YEARS" = "true" ]; then args+=(--all-years); fi
          python -m ama_baseball "${args[@]}"

      - name: CSV をアップロードする
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ steps.started.outputs.at }}
          path: data/
          if-no-files-found: warn
